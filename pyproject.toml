[project]
name = "trend-scout"
version = "0.1.0"
description = "A local, read-only trend engine for Claude Code: Reddit, YouTube, Instagram (official API) and TikTok Creative Center, scored for velocity and hooks."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27",
  "youtube-transcript-api>=1.0",
  "yt-dlp>=2025.1.1",
  "playwright>=1.48",
  "mlx-whisper>=0.4; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "ocrmac>=1.0 ; sys_platform == 'darwin'",
]

[project.scripts]
trend-scout = "trend_scout.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
